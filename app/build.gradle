plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ruhul.engine'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ruhul.engine'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
